<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .pos-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: -1px;
      }
    </style>
  </defs>
  <!-- Hard Shadow -->
  <rect x="26" y="26" width="150" height="150" rx="34" fill="#121212"/>
  
  <!-- Brand Box -->
  <rect x="18" y="18" width="150" height="150" rx="34" fill="#1d72f2" stroke="#121212" stroke-width="6"/>
  
  <!-- POS Single Line Text -->
  <text x="93" y="91" class="pos-text">POS</text>
</svg>
