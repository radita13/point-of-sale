<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .pos-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 155px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: -3px;
      }
    </style>
  </defs>
  <!-- Hard Shadow -->
  <rect x="70" y="70" width="400" height="400" rx="90" fill="#121212"/>
  
  <!-- Brand Box -->
  <rect x="50" y="50" width="400" height="400" rx="90" fill="#1d72f2" stroke="#121212" stroke-width="16"/>
  
  <!-- POS Single Line Text -->
  <text x="250" y="246" class="pos-text">POS</text>
</svg>
